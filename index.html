<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>小羊过河</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #071726; color: #f6fbff; }
    * { box-sizing: border-box; } body { margin: 0; min-width: 320px; } button { font: inherit; }
    button:focus-visible { outline: 3px solid #ffe26d; outline-offset: 3px; }
    .app { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; background: radial-gradient(circle at 50% -20%, #216079, #071726 60%); }
    .hud { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px clamp(14px, 3vw, 36px); background: rgba(3, 18, 30, .88); border-bottom: 1px solid rgba(150,220,255,.2); z-index: 2; }
    h1 { margin: 0 auto 0 0; font-size: clamp(1.15rem, 2.5vw, 1.7rem); } .metrics { display: flex; flex-wrap: wrap; gap: 9px; } .metric { padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.08); font-size: .92rem; }
    .icon-button, .primary { min-height: 44px; border: 0; border-radius: 10px; cursor: pointer; color: #092033; background: #ffe26d; font-weight: 800; padding: 9px 16px; }
    .icon-button { background: #dff5ff; min-width: 44px; padding: 8px; } .stage { position: relative; min-height: 580px; height: calc(100vh - 76px); }
    .canvas { width: 100%; height: 100%; } .overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; padding: 20px; z-index: 3; }
    .card { max-width: 440px; padding: 26px; border: 1px solid rgba(255,255,255,.25); border-radius: 18px; background: rgba(3,18,30,.9); box-shadow: 0 18px 70px rgba(0,0,0,.45); text-align: center; pointer-events: auto; }
    .card h2 { margin: 0 0 8px; } .card p { color: #c7e5f4; line-height: 1.55; } .toast { align-self: start; margin-top: 28px; padding: 11px 18px; border-radius: 999px; background: #ffe26d; color: #092033; font-weight: 900; box-shadow: 0 5px 24px rgba(255,226,109,.4); }
    .hint { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: min(90%, 540px); text-align: center; color: #e4f6ff; text-shadow: 0 1px 3px #000; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (max-width: 620px) { .hud { gap: 8px; } h1 { width: 100%; } .stage { height: calc(100vh - 138px); min-height: 500px; } .metric { font-size: .83rem; } }
  </style>
</head>
<body>
  <main id="root"><noscript>此游戏需要启用 JavaScript 才能运行。</noscript></main>
  <script type="module" src="./vendor/runtime.js"></script>
</body>
</html>
